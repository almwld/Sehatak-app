name: 🚀 Build Single APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { flutter-version: '3.16.0', channel: 'stable', cache: true }
    
    - name: Create Android
      run: |
        cd sehatak_flutter
        rm -rf android
        flutter create --platforms android .
    
    - name: google-services.json
      run: |
        cat > sehatak_flutter/android/app/google-services.json << 'JSONEOF'
        {"project_info":{"project_number":"1053269106596","project_id":"sehatak-platform","storage_bucket":"sehatak-platform.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1053269106596:android:de2128024cd023a973ab31","android_client_info":{"package_name":"com.sehatak.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
        JSONEOF
    
    - name: Fix Gradle
      run: |
        cd sehatak_flutter
        sed -i 's/id "dev.flutter.flutter-plugin-loader" version "1.0.0"/id "dev.flutter.flutter-plugin-loader" version "1.0.0"\n    id "com.google.gms.google-services" version "4.3.15" apply false/' android/settings.gradle
        sed -i '2a\    id "com.google.gms.google-services"' android/app/build.gradle
        sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.3.15"/' android/build.gradle
    
    - name: Install
      run: cd sehatak_flutter && flutter pub get
    
    - name: Build Single APK
      run: cd sehatak_flutter && flutter build apk --release
    
    - name: Show size
      run: ls -lh sehatak_flutter/build/app/outputs/flutter-apk/
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Sehatak
        path: sehatak_flutter/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
