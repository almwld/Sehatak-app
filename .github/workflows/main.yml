name: 🚀 Build Sehatak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { flutter-version: '3.22.0', channel: 'stable', cache: true }
    
    - name: Create Android from scratch
      run: |
        cd sehatak_flutter
        rm -rf android
        flutter create --platforms android .
    
    - name: Add google-services.json
      run: |
        cat > sehatak_flutter/android/app/google-services.json << 'JSONEOF'
        {
          "project_info": {
            "project_number": "1053269106596",
            "project_id": "sehatak-platform",
            "storage_bucket": "sehatak-platform.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                "android_client_info": { "package_name": "com.sehatak.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        JSONEOF
    
    - name: Fix Android settings
      run: |
        cd sehatak_flutter
        
        cat > android/settings.gradle << 'SETTINGS'
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null
                return flutterSdkPath
            }()
            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.2.0" apply false
            id "org.jetbrains.kotlin.android" version "1.9.22" apply false
            id "com.google.gms.google-services" version "4.4.2" apply false
        }
        include ":app"
        SETTINGS
        
        cat > android/app/build.gradle << 'GRADLE'
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
            id "com.google.gms.google-services"
        }
        android {
            namespace "com.sehatak.app"
            compileSdk 34
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
                coreLibraryDesugaringEnabled true
            }
            kotlinOptions { jvmTarget = '1.8' }
            defaultConfig {
                applicationId "com.sehatak.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
                multiDexEnabled true
            }
            buildTypes {
                release { signingConfig signingConfigs.debug }
            }
        }
        flutter { source '../..' }
        dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }
        GRADLE
        
        cat > android/build.gradle << 'ROOT'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.google.gms:google-services:4.4.2'
            }
        }
        rootProject.buildDir = '../build'
        subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
        subprojects { project.evaluationDependsOn(':app') }
        tasks.register("clean", Delete) { delete rootProject.buildDir }
        ROOT
        
        cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAP'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
        WRAP
    
    - name: Install dependencies
      run: cd sehatak_flutter && flutter pub get
    
    - name: Build APK
      run: cd sehatak_flutter && flutter build apk --release --split-per-abi
    
    - name: Show sizes
      run: ls -lh sehatak_flutter/build/app/outputs/flutter-apk/
    
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Sehatak-APKs
        path: sehatak_flutter/build/app/outputs/flutter-apk/*.apk
        retention-days: 30
