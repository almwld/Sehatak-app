name: 🚀 Build Sehatak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { flutter-version: '3.22.0', channel: 'stable', cache: true }

    - name: Create Android
      run: |
        cd sehatak_flutter
        rm -rf android
        mkdir -p android/app/src/main/kotlin/com/sehatak/app
        mkdir -p android/gradle/wrapper
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/drawable
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/

    - name: Create Gradle files
      run: |
        cd sehatak_flutter
        
        cat > android/settings.gradle << 'SET'
        pluginManagement {
            def sdk = { def p = new Properties(); file("local.properties").withInputStream { p.load(it) }; return p.getProperty("flutter.sdk") }()
            includeBuild("$sdk/packages/flutter_tools/gradle")
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "7.4.2" apply false
            id "org.jetbrains.kotlin.android" version "1.9.0" apply false
            id "com.google.gms.google-services" version "4.3.15" apply false
        }
        include ":app"
        SET
        
        cat > android/build.gradle << 'ROOT'
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath 'com.google.gms:google-services:4.3.15'
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        rootProject.buildDir = '../build'
        subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
        subprojects { project.evaluationDependsOn(':app') }
        tasks.register("clean", Delete) { delete rootProject.buildDir }
        ROOT
        
        cat > android/app/build.gradle << 'APP'
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
            id "com.google.gms.google-services"
        }
        android {
            namespace "com.sehatak.app"
            compileSdkVersion 34
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            defaultConfig {
                applicationId "com.sehatak.app"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes { release { signingConfig signingConfigs.debug } }
        }
        flutter { source '../..' }
        APP
        
        cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAP'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
        WRAP
        
        cat > android/gradle.properties << 'PROPS'
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
        android.useAndroidX=true
        android.enableJetifier=true
        PROPS

    - name: Create AndroidManifest & MainActivity
      run: |
        cd sehatak_flutter
        
        cat > android/app/src/main/AndroidManifest.xml << 'MAN'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="صحتك" android:icon="@mipmap/ic_launcher">
                <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                    <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
            <uses-permission android:name="android.permission.INTERNET"/>
        </manifest>
        MAN
        
        cat > android/app/src/main/kotlin/com/sehatak/app/MainActivity.kt << 'KT'
        package com.sehatak.app
        import io.flutter.embedding.android.FlutterActivity
        class MainActivity: FlutterActivity()
        KT
        
        cat > android/app/src/main/res/values/styles.xml << 'STY'
        <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar"><item name="android:windowBackground">@drawable/launch_background</item></style>
            <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar"><item name="android:windowBackground">@drawable/launch_background</item></style>
        </resources>
        STY
        
        cat > android/app/src/main/res/drawable/launch_background.xml << 'DRAW'
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/black"/></layer-list>
        DRAW
        
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

    - name: Add google-services.json
      run: |
        cat > sehatak_flutter/android/app/google-services.json << 'JSONEOF'
        {"project_info":{"project_number":"1053269106596","project_id":"sehatak-platform","storage_bucket":"sehatak-platform.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1053269106596:android:de2128024cd023a973ab31","android_client_info":{"package_name":"com.sehatak.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
        JSONEOF

    - name: Install
      run: cd sehatak_flutter && flutter pub get

    - name: Build
      run: cd sehatak_flutter && flutter build apk --release --split-per-abi

    - name: Show sizes
      run: ls -lh sehatak_flutter/build/app/outputs/flutter-apk/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Sehatak-APKs
        path: sehatak_flutter/build/app/outputs/flutter-apk/*.apk
        retention-days: 30
